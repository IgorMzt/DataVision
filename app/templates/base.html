<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}DataVision{% endblock %}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><div class="ambient ambient-a"></div><div class="ambient ambient-b"></div><nav class="nav"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">D</span><span>DataVision</span></a><div class="nav-links"><a href="{{ url_for('main.index') }}">Início</a><a href="{{ url_for('projects.index') }}">Projetos</a><a class="button small" href="{{ url_for('projects.create') }}">+ Novo projeto</a></div></nav><main>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-wrap">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>DataVision <span>•</span> dados claros, decisões melhores.</footer><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
